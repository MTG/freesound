{# Category filter experiment in the search page; rendered by CategoryFilterFeedback.render_page_items. #}

{# Info about the search. experiments.js sends it with every answer of this experiment. #}
<div data-experiment-shared="{{ experiment_id }}" style="display: none;">
    {% for name, value in search.items %}
        <input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
</div>
